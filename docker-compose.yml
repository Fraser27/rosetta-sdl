services:
  neo4j:
    image: neo4j:5.26-community
    profiles: ["ce"]  # local Neo4j only runs under the 'ce' profile; omit for Aura
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/semantic-layer
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  rosetta:
    build: .
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-semantic-layer}
      GLUE_DATABASES: ""
      VECTOR_BUCKETS: ""
      ATHENA_WORKGROUP: primary  # Overridden by CDK to 'semantic-layer-wg'
      ATHENA_OUTPUT_BUCKET: ""  # Overridden by CDK with S3 bucket
      # METRICS_FILE: /app/sample/metrics.yaml  # uncomment to load sample metrics
      BEDROCK_QUERY_MODEL: global.anthropic.claude-sonnet-4-5-20250929-v1:0
      BEDROCK_ENRICHMENT_MODEL: global.anthropic.claude-haiku-4-5-20251001-v1:0
      # AWS — boto3 reads these for region + credentials (Bedrock, Glue, Athena, S3 Vectors).
      # On EC2 the instance role supplies these via IMDS; locally they come from .env/shell.
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      neo4j:
        condition: service_healthy
        required: false  # Aura runs (no 'ce' profile) skip the local neo4j wait

volumes:
  neo4j_data:
